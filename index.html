<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Maison Ámbar — The Slow Pour</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#070504;--ink:#f1e3cc;--dim:#a8957a;--amber:#e0883a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:'Playfair Display',Georgia,'Times New Roman',serif}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.ui{position:fixed;inset:0;z-index:2;pointer-events:none;padding:clamp(20px,4vw,52px);padding-top:calc(clamp(20px,4vw,52px) + env(safe-area-inset-top,0px));padding-bottom:calc(clamp(20px,4vw,52px) + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:space-between}
nav{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;letter-spacing:.32em;text-transform:uppercase;color:var(--dim)}
nav b{font-weight:500;color:var(--ink);letter-spacing:.4em}
nav span{display:flex;gap:2.2rem}
.hero{max-width:560px}
.eyebrow{font-style:italic;color:var(--amber);letter-spacing:.14em;font-size:1rem;margin-bottom:1.2rem;opacity:0;animation:rise 1.6s .4s forwards}
h1{font-weight:400;font-size:clamp(2.8rem,7.2vw,6.2rem);line-height:.98;letter-spacing:-.01em;opacity:0;animation:rise 1.8s .7s forwards}
h1 em{color:var(--amber);font-style:italic}
p{margin-top:1.6rem;max-width:400px;color:var(--dim);line-height:1.7;font-size:1.02rem;opacity:0;animation:rise 1.8s 1.1s forwards}
.cta{pointer-events:auto;display:inline-block;margin-top:2.2rem;padding:1rem 2.2rem;border:1px solid rgba(224,136,58,.55);color:var(--ink);text-decoration:none;letter-spacing:.28em;font-size:.72rem;text-transform:uppercase;transition:.5s;opacity:0;animation:rise 1.8s 1.4s forwards;backdrop-filter:blur(4px)}
.cta:hover{background:var(--amber);color:#120a05;box-shadow:0 0 40px rgba(224,136,58,.45)}
.foot{display:flex;justify-content:space-between;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media(max-width:760px){nav span{display:none}.hero{max-width:100%}p{font-size:.95rem}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="ui">
  <nav><b>Maison Ámbar</b><span><a>Roasts</a><a>Atelier</a><a>Journal</a></span></nav>
  <div class="hero">
    <div class="eyebrow">Single-origin · Hand-poured · Est. 1887</div>
    <h1>The art of<br>the <em>slow pour</em></h1>
    <p>Dark roasts steeped in candlelight and old libraries. Each cup is a quiet ceremony, poured into hand-blown glass.</p>
    <a class="cta" href="#">Discover the Collection</a>
  </div>
  <div class="foot"><span>Scroll to taste</span><span>N° 07 — Midnight Reserve</span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function(){
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.physicallyCorrectLights=true;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x140b07);
scene.fog=new THREE.FogExp2(0x140b07,0.03);
const camera=new THREE.PerspectiveCamera(35,1,0.1,60);
const target=new THREE.Vector3(0,1.85,0);

/* ---------- Procedural studio environment (PMREM) ---------- */
(function(){
  const env=new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.BoxGeometry(30,20,30),new THREE.MeshBasicMaterial({color:0x0b0604,side:THREE.BackSide})));
  const panel=(w,h,c,k,x,y,z)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(k),side:THREE.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,1.5,0);env.add(m);};
  panel(2,12,0xff9a45,5,-9,3,-8);   // warm rim strips behind
  panel(2,12,0xffb066,5,9,3,-8);
  panel(10,6,0xffe2bd,2.5,0,11,2);     // soft overhead
  panel(3,8,0xffd0a0,2.5,-10,2,6);     // key kicker
  panel(5,3,0x7d93c0,1.2,8,1,9);     // faint cold fill
  panel(14,0.5,0xff8a30,3,0,-3,-10); // low horizon glow
  const pm=new THREE.PMREMGenerator(renderer);
  scene.environment=pm.fromScene(env,0.03).texture;
})();

/* ---------- 3-point lighting rig ---------- */
const key=new THREE.SpotLight(0xffd6a6,70,30,0.7,1,2);
key.position.set(-5,7,6);key.target.position.set(0,1.2,0);scene.add(key,key.target);
const rimL=new THREE.SpotLight(0xff8a2e,90,24,0.9,1,2);
rimL.position.set(-4.5,3.5,-5);rimL.target.position.set(0,1.2,0);scene.add(rimL,rimL.target);
const rimR=new THREE.SpotLight(0xffa850,80,24,0.9,1,2);
rimR.position.set(4.5,4,-5);rimR.target.position.set(0,1.2,0);scene.add(rimR,rimR.target);
const fill=new THREE.PointLight(0x6f86b8,6,20,2);fill.position.set(5,2,6);scene.add(fill);
const under=new THREE.PointLight(0xff9a40,4,6,2);under.position.set(0,1.4,0.6);

/* ---------- Scene group ---------- */
const G=new THREE.Group();scene.add(G);G.add(under);

const glass=new THREE.MeshPhysicalMaterial({
  color:0xfff1dc,transmission:1,ior:1.52,thickness:2.5,roughness:0.05,metalness:0,
  clearcoat:1,clearcoatRoughness:0.03,attenuationColor:new THREE.Color(0xffe2b8),attenuationDistance:30,
  specularIntensity:1,envMapIntensity:2.4,side:THREE.DoubleSide});

const spline=(pts,n)=>new THREE.SplineCurve(pts.map(p=>new THREE.Vector2(p[0],p[1]))).getPoints(n);

/* Cup profile: outer wall → rim → inner wall (heavy glass base) */
const outer=spline([[0.001,0],[0.5,0],[0.58,0.07],[0.92,0.3],[1.16,0.75],[1.26,1.3],[1.3,1.65]],36);
const rim=[new THREE.Vector2(1.29,1.69),new THREE.Vector2(1.24,1.7),new THREE.Vector2(1.2,1.66)];
const inner=spline([[1.2,1.66],[1.17,1.3],[1.07,0.8],[0.82,0.45],[0.45,0.31],[0.001,0.28]],36);
const cup=new THREE.Mesh(new THREE.LatheGeometry([...outer,...rim,...inner],128),glass);
G.add(cup);

/* Handle */
const hc=new THREE.CatmullRomCurve3([[1.22,1.35,0],[1.75,1.38,0],[2.12,1.05,0],[1.95,0.65,0],[1.42,0.55,0],[1.0,0.62,0]].map(p=>new THREE.Vector3(...p)));
G.add(new THREE.Mesh(new THREE.TubeGeometry(hc,64,0.085,20,false),glass));

/* Gilded rims */
const gold=new THREE.MeshStandardMaterial({color:0xc99a4a,metalness:1,roughness:0.28});
const ring=(r,y,t)=>{const m=new THREE.Mesh(new THREE.TorusGeometry(r,t,16,128),gold);m.rotation.x=Math.PI/2;m.position.y=y;G.add(m);};
ring(1.25,1.69,0.02);ring(1.255,1.58,0.012);ring(2.67,0.18,0.022);ring(0.52,0.012,0.015);

/* Saucer */
const sauc=spline([[0.001,-0.14],[1.6,-0.12],[2.45,0.0],[2.7,0.16]],24).concat([new THREE.Vector2(2.66,0.19)],
  spline([[2.62,0.17],[2.35,0.05],[1.5,-0.03],[0.001,-0.03]],24));
G.add(new THREE.Mesh(new THREE.LatheGeometry(sauc,128),glass));

/* Floor */
const floor=new THREE.Mesh(new THREE.CircleGeometry(16,64),new THREE.MeshStandardMaterial({color:0x120a06,roughness:0.32,metalness:0.7}));
floor.rotation.x=-Math.PI/2;floor.position.y=-0.15;scene.add(floor);

/* ---------- Coffee body + animated surface ---------- */
const LEVEL=1.16;
const body=inner.filter(p=>p.y<=LEVEL).map(p=>new THREE.Vector2(p.x*0.985,Math.max(p.y,0.3)));
body.reverse();
const coffee=new THREE.Mesh(new THREE.LatheGeometry(body.concat([new THREE.Vector2(0.001,LEVEL)]).reverse().reverse(),96),
  new THREE.MeshPhysicalMaterial({color:0x1c0d06,roughness:0.18,clearcoat:1,side:THREE.DoubleSide}));
G.add(coffee);
const surfRad=body.reduce((m,p)=>Math.max(m,p.x),0);
const surfU={uTime:{value:0}};
const surface=new THREE.Mesh(new THREE.CircleGeometry(surfRad,96),new THREE.ShaderMaterial({uniforms:surfU,
 vertexShader:`varying vec2 vP;varying vec3 vW;void main(){vP=position.xy;vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
 fragmentShader:`uniform float uTime;varying vec2 vP;varying vec3 vW;
 void main(){float d=length(vP);
  float rip=sin(d*42.-uTime*7.)*exp(-d*3.2)+0.5*sin(d*80.-uTime*11.)*exp(-d*6.);
  float crema=smoothstep(0.55,1.05,d);
  vec3 c=mix(vec3(.045,.02,.01),vec3(.2,.095,.035),crema*.8);
  c+=vec3(.9,.45,.15)*max(rip,0.)*.22*exp(-d*2.);
  c+=vec3(1.,.6,.25)*smoothstep(.11,.0,d)*.5*(.6+.4*sin(uTime*18.));
  vec3 V=normalize(cameraPosition-vW);float f=pow(1.-abs(V.y),3.);
  c+=vec3(1.,.55,.2)*f*.35;
  gl_FragColor=vec4(c,1.);}`}));
surface.rotation.x=-Math.PI/2;surface.position.y=LEVEL;G.add(surface);

/* ---------- The Pour (tube + flowing shader) ---------- */
const path=new THREE.CatmullRomCurve3([[0.55,8,0],[0.22,5.2,0.02],[0.04,3.1,0],[0,LEVEL+0.01,0]].map(p=>new THREE.Vector3(...p)));
const streamU={uTime:{value:0}};
const stream=new THREE.Mesh(new THREE.TubeGeometry(path,260,0.062,24,false),new THREE.ShaderMaterial({uniforms:streamU,transparent:true,
 vertexShader:`uniform float uTime;varying vec2 vUv;varying vec3 vN;varying vec3 vV;
 void main(){vUv=uv;float u=uv.x;
  float w=1.+.22*sin(u*70.-uTime*9.)+.12*sin(u*135.-uTime*15.+uv.y*12.57);
  w*=mix(1.,.7,smoothstep(0.,.75,u));w*=1.+1.1*smoothstep(.94,1.,u);
  vec3 p=position+normal*.062*(w-1.);
  vec4 mv=modelViewMatrix*vec4(p,1.);vN=normalize(normalMatrix*normal);vV=-mv.xyz;gl_Position=projectionMatrix*mv;}`,
 fragmentShader:`uniform float uTime;varying vec2 vUv;varying vec3 vN;varying vec3 vV;
 void main(){vec3 N=normalize(vN),V=normalize(vV);
  float f=pow(1.-abs(dot(N,V)),2.4);
  float flow=sin(vUv.x*95.-uTime*13.+sin(vUv.y*18.85+uTime*2.)*1.6)*.5+.5;
  float flow2=sin(vUv.x*38.-uTime*7.+vUv.y*6.28)*.5+.5;
  vec3 c=mix(vec3(.05,.022,.01),vec3(.34,.15,.05),flow*.55+flow2*.25);
  c+=vec3(.55,.22,.06)*pow(1.-f,3.)*.22; // amber translucency core
  vec3 L=normalize(vec3(-.5,.6,.7));vec3 H=normalize(L+V);
  c+=vec3(1.,.8,.55)*pow(max(dot(N,H),0.),70.)*(.7+flow*.5);
  c+=vec3(1.,.5,.15)*f*.8; // glowing rim
  gl_FragColor=vec4(c,.97*smoothstep(0.,.04,vUv.x));}`}));
G.add(stream);

/* ---------- Steam particles ---------- */
const sc=document.createElement('canvas');sc.width=sc.height=128;
const sx=sc.getContext('2d'),gr=sx.createRadialGradient(64,64,0,64,64,64);
gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.35,'rgba(255,255,255,.45)');gr.addColorStop(.7,'rgba(255,255,255,.1)');gr.addColorStop(1,'rgba(255,255,255,0)');
sx.fillStyle=gr;sx.fillRect(0,0,128,128);
const sprite=new THREE.CanvasTexture(sc);
const N=280,A=new Float32Array(N*3),B=new Float32Array(N*4),P=new Float32Array(N*3);
for(let i=0;i<N;i++){
  const a=Math.random()*6.283,r=Math.sqrt(Math.random())*surfRad*0.85;
  A.set([Math.cos(a)*r,Math.sin(a)*r,Math.random()],i*3);
  B.set([0.5+Math.random()*0.7,0.55+Math.random()*0.7,0.5+Math.random(),0.07+Math.random()*0.06],i*4);
}
const sg=new THREE.BufferGeometry();
sg.setAttribute('position',new THREE.BufferAttribute(P,3));
sg.setAttribute('aA',new THREE.BufferAttribute(A,3));sg.setAttribute('aB',new THREE.BufferAttribute(B,4));
const steamU={uTime:{value:0},uScale:{value:800},uBase:{value:LEVEL+0.03},map:{value:sprite}};
const steam=new THREE.Points(sg,new THREE.ShaderMaterial({uniforms:steamU,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
 vertexShader:`attribute vec3 aA;attribute vec4 aB;uniform float uTime,uScale,uBase;varying float vA;
 void main(){float life=fract(uTime*aB.w+aA.z);
  vec3 p=vec3(aA.x,uBase+life*aB.x*3.4,aA.y);
  p.x+=sin(life*7.+aA.z*40.)*.24*aB.z*life+life*life*.55;
  p.z+=cos(life*5.+aA.z*20.)*.14*aB.z*life;
  vA=smoothstep(0.,.12,life)*pow(1.-life,1.7);
  vec4 mv=modelViewMatrix*vec4(p,1.);
  gl_PointSize=aB.y*(.6+life*3.4)*uScale/-mv.z;gl_Position=projectionMatrix*mv;}`,
 fragmentShader:`uniform sampler2D map;varying float vA;
 void main(){float t=texture2D(map,gl_PointCoord).a;gl_FragColor=vec4(vec3(1.,.8,.58),t*vA*.13);}`}));
steam.frustumCulled=false;G.add(steam);

/* ---------- Post-processing ---------- */
const composer=new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene,camera));
const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(512,512),0.4,0.6,0.8);
composer.addPass(bloom);
const finalPass=new THREE.ShaderPass({uniforms:{tDiffuse:{value:null},uTime:{value:0}},
 vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`uniform sampler2D tDiffuse;uniform float uTime;varying vec2 vUv;
 float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233))+uTime)*43758.5453);}
 void main(){vec3 c=texture2D(tDiffuse,vUv).rgb;
  c*=1.15;c=(c*(2.51*c+.03))/(c*(2.43*c+.59)+.14);          // ACES filmic
  c=pow(clamp(c,0.,1.),vec3(1./2.2));
  float d=distance(vUv,vec2(.5,.5));c*=smoothstep(.88,.22,d);   // vignette
  c+=(h(vUv*1000.)-.5)*.03;                                     // film grain
  c*=vec3(1.02,1.0,.96);gl_FragColor=vec4(c,1.);}`});
composer.addPass(finalPass);

/* ---------- Resize + parallax ---------- */
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);composer.setSize(w,h);
  camera.aspect=w/h;
  const wide=w/h>1.05;
  camera.fov=wide?35:46;camera.updateProjectionMatrix();
  G.position.x=wide?Math.min(1.9,(w/h-1)*1.5+0.7):0;
  G.position.y=wide?0:-0.7;
  steamU.uScale.value=h*renderer.getPixelRatio();
}
addEventListener('resize',resize);resize();

const m={x:0,y:0},s={x:0,y:0};
addEventListener('pointermove',e=>{m.x=e.clientX/innerWidth*2-1;m.y=e.clientY/innerHeight*2-1;});

const clock=new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  const t=clock.getElapsedTime();
  s.x+=(m.x-s.x)*0.04;s.y+=(m.y-s.y)*0.04;
  const ang=s.x*0.55+Math.sin(t*0.15)*0.06, el=2.35-s.y*0.9, R=8.2;
  camera.position.set(Math.sin(ang)*R+G.position.x*0.5,el,Math.cos(ang)*R);
  camera.lookAt(target.x+G.position.x*0.6,target.y+G.position.y,target.z);
  streamU.uTime.value=surfU.uTime.value=steamU.uTime.value=finalPass.uniforms.uTime.value=t;
  key.intensity=70+Math.sin(t*1.7)*3;
  rimL.intensity=90+Math.sin(t*0.9)*6;
  composer.render();
})();
})();
</script>
</body>
</html>
